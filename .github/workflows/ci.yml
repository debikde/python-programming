name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy

      - name: Pytest with branch coverage (minimum 70%)
        run: uv run --locked pytest --cov-report=xml:coverage.xml

      - name: Pre-commit
        run: uv run --locked pre-commit run --all-files

      - name: Build Python wheel
        run: uv build --wheel

      - name: Save Python package and coverage
        uses: actions/upload-artifact@v4
        with:
          name: lab10-python
          path: |
            coverage.xml
            dist/*.whl
          if-no-files-found: error

  frontend:
    name: Vue checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build
        working-directory: frontend
        run: |
          npm run lint
          npm run test
          npm run build
          npm audit --audit-level=high

      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: lab10-frontend
          path: frontend/dist

  windows-demo:
    name: Windows runner demonstration
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, gait-lab]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy

      - name: Pytest and coverage report
        run: uv run --locked pytest --cov-report=xml:coverage.xml

      - name: Pre-commit
        run: uv run --locked pre-commit run --all-files

      - name: Build Python wheel
        run: uv build --wheel

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Save demonstration files
        uses: actions/upload-artifact@v4
        with:
          name: lab10-windows-demo
          path: |
            coverage.xml
            dist/*.whl
            frontend/dist
          if-no-files-found: error
